version: "3.7"
services:
  code-sql-db:
    container_name: code-sql-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Pro247!!"
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: true 
    volumes:
      - code-sql-data:/var/opt/mssql/code
 

volumes:
  code-sql-data: